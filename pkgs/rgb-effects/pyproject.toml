[tool.poetry]
name = "rgb-effects"
version = "0.1.0"
description = "Keyboard lighting effects driven through the OpenRGB SDK"
authors = []
packages = [{ include = "rgb_effects", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
openrgb-python = "^0.3"
dbus-fast = "^5.0"
evdev = "^1.9"
numpy = "^2.0"

[tool.poetry.group.dev.dependencies]
black = "^24.0"
flake8 = "^7.0"
flake8-bugbear = "^24.0"
bandit = { extras = ["toml"], version = "^1.7" }
pytest = "^8.0"
pytest-asyncio = "^1.0"

[tool.poetry.scripts]
rgb-effects = "rgb_effects.__main__:main"
rgb-keyreader = "rgb_effects.sources.keys.reader:main"
rgb-focus = "rgb_effects.dbus.focus:main"
rgb-notifywatch = "rgb_effects.sources.notifications:main"
rgb-screen = "rgb_effects.dbus.screen:main"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
